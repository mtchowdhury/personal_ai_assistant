<div class="detail-page">
  <header class="detail-header">
    <div class="header-left">
      <button type="button" class="link-btn" (click)="goBack()">← Spaces</button>
      <h1>{{ space?.name }}</h1>
      <span class="kind-badge" *ngIf="space">{{ space.kind }}</span>
    </div>
    <div class="header-right" *ngIf="space">
      <a [routerLink]="['/ai-chat']" [queryParams]="{ spaceId: spaceId }" class="header-btn">💬 Chat in this space</a>
      <a [routerLink]="['/spaces', 'search']" [queryParams]="{ spaceId: spaceId }" class="header-btn">🔍 Search</a>
      <a [routerLink]="['/spaces', spaceId, 'settings']" class="header-btn">⚙ Settings</a>
      <button type="button" class="header-btn primary" (click)="addEntry()">+ Entry</button>
    </div>
  </header>

  <app-loading-spinner *ngIf="isLoading" label="Loading space…"></app-loading-spinner>

  <main class="detail-main" *ngIf="!isLoading && space">
    <section class="state-strip" *ngIf="stateEntries().length">
      <span class="state-item" *ngFor="let s of stateEntries()"><strong>{{ s.key }}:</strong> {{ s.value }}</span>
    </section>

    <div class="detail-body">
      <aside class="tree-panel">
        <div class="tree-header">
          <span>Tree</span>
          <button type="button" class="tree-add-btn" (click)="showAddNode = !showAddNode">+ Node</button>
        </div>

        <div class="add-node-form" *ngIf="showAddNode">
          <input type="text" [(ngModel)]="newNodeName" placeholder="Node name"
                 (keyup.enter)="addNode()" />
          <button type="button" (click)="addNode()">Add</button>
        </div>

        <div class="tree-list">
          <button type="button" class="tree-item" [class.active]="selectedNodeId === null"
                  (click)="selectNode(null)">
            <span class="tree-label">All entries</span>
          </button>
          <button type="button" class="tree-item" *ngFor="let n of flatTree"
                  [class.active]="selectedNodeId === n.id"
                  [style.padding-left.px]="12 + n.depth * 16"
                  (click)="selectNode(n.id)">
            <span class="tree-label">{{ n.name }}</span>
            <span class="tree-count" *ngIf="n.entryCount">{{ n.entryCount }}</span>
          </button>
        </div>
      </aside>

      <section class="entries-panel">
        <div class="node-summary" *ngIf="selectedNode() as n">
          <h2>{{ n.name }}</h2>
          <p *ngIf="n.summary">{{ n.summary }}</p>
        </div>

        <app-loading-spinner *ngIf="entriesLoading" label="Loading entries…"></app-loading-spinner>

        <div *ngIf="!entriesLoading && entries.length === 0" class="empty">
          No entries here yet.
          <button type="button" class="link-btn" (click)="addEntry()">Add one</button>
        </div>

        <div class="entry-list" *ngIf="!entriesLoading">
          <button type="button" class="entry-card" *ngFor="let e of entries" (click)="openEntry(e)">
            <div class="entry-top">
              <span class="entry-type">{{ e.type }}</span>
              <span class="entry-date" *ngIf="e.occurredOn">{{ e.occurredOn | date:'mediumDate' }}</span>
            </div>
            <span class="entry-title">{{ e.title }}</span>
            <span class="entry-excerpt">{{ e.excerpt }}</span>
            <div class="entry-tags" *ngIf="e.tags.length">
              <span class="tag" *ngFor="let t of e.tags">#{{ t }}</span>
            </div>
          </button>
        </div>
      </section>
    </div>
  </main>
</div>
